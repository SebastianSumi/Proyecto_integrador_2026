spring:
  application:
    name: saludablemente
  config:
    # Local-only Docker credentials are optional and ignored by Git. The file uses KEY=value syntax.
    import: optional:file:.env.local[.properties]
  profiles:
    default: dev

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Content-Type,Authorization}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: ${CORS_MAX_AGE:3600}
