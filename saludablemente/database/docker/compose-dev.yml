name: saludablemente-backend-dev

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: saludablemente-oracle
    restart: unless-stopped
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: 123456
      ORACLE_DATABASE: SALUDPDB
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  oracle-data:
