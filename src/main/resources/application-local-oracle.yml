spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1522/FREEPDB1}
    username: ${DB_USERNAME:SALUDABLEMENTE_APP}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    database: ORACLE
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  devtools:
    restart:
      enabled: false

logging:
  level:
    pe.edu.upeu.saludablemente: INFO
    org.hibernate.SQL: WARN
